<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generated Design</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

.container{
background:white;
padding:20px;
margin:40px auto;
width:600px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

img{
max-width:100%;
margin-top:15px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
background:black;
color:white;
border:none;
margin-top:15px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Generated Design</h1>

<img id="resultImage">

<br>

<button onclick="goBack()">Back</button>

</div>

<script>

const imageUrl = localStorage.getItem("generatedImage");

console.log("Loaded image URL:", imageUrl);

if(imageUrl){

const imgElement = document.getElementById("resultImage");

// FORCE reload image with timestamp
imgElement.src = imageUrl + "&t=" + new Date().getTime();

imgElement.onerror = function(){

console.log("Image failed, retrying...");

imgElement.src =
"https://image.pollinations.ai/prompt/modern luxury bungalow architecture";

};

}else{

document.body.innerHTML += "<p>No image generated</p>";

}

function goBack(){

window.location.href="/";

}

</script>

</body>
</html>
