<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generated Design</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

.container{
background:white;
padding:20px;
margin:40px auto;
width:600px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

img{
max-width:100%;
margin-top:15px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
background:black;
color:white;
border:none;
margin-top:15px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Generated Design</h1>

<img id="resultImage" alt="Generated image will appear here">

<br>

<button onclick="goBack()">Back</button>

</div>

<script>

// Load the image URL from storage
    const imageData = localStorage.getItem("generatedImage");

    const resultImg = document.getElementById("resultImage");

    if(imageData) {
        resultImg.src = imageData;
        console.log("Displaying image from URL:", imageData);
    } else {
        resultImg.alt = "No design was generated.";
    }

    function goBack(){
        window.location.href = "index.html";
    }

// back button
function goBack(){

window.location.href="/";

}

</script>

</body>
</html>
