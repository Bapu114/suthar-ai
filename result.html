<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generated Design</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

.container{
background:white;
padding:20px;
margin:40px auto;
width:600px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

img{
max-width:100%;
margin-top:15px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
background:black;
color:white;
border:none;
margin-top:15px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Generated Design</h1>

<img id="resultImage" src="" alt="Loading image...">

<br>

<button onclick="goBack()">Back</button>

</div>

<script>

const img = document.getElementById("resultImage");

const imageUrl = localStorage.getItem("generatedImage");

console.log("Loaded image:", imageUrl);

if(imageUrl){

// FORCE image load
img.src = imageUrl;

// retry if fails
img.onerror = function(){

console.log("Retry loading image...");

// use proxy reload trick
img.src = imageUrl + "?t=" + new Date().getTime();

};

}else{

img.alt = "No image generated";

}

function goBack(){

window.location.href="/";

}

</script>

</body>
</html>
