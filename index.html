<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generated Design</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Generated Design</h1>

<img id="resultImage" style="max-width:100%;">

<br><br>

<button onclick="goBack()">Back</button>

</div>

<script>

// load image
const img = localStorage.getItem("generatedImage");

if(img){
document.getElementById("resultImage").src = img;
}

// back button
function goBack(){

// IMPORTANT: go back to homepage
window.location.href = "/";

}

</script>

</body>
</html>
