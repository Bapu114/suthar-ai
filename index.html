<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generated Design</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Generated Design</h1>

<img id="resultImage" style="max-width:100%;">

<br><br>

<button onclick="goBack()">Back</button>

</div>

<script>

const img = localStorage.getItem("generatedImage");

console.log("Saved image:", img);

if(img){
document.getElementById("resultImage").src = img;
}else{
document.body.innerHTML += "<p>No image found</p>";
}

function goBack(){
window.location.href="index.html";
}

</script>

</body>
</html>
