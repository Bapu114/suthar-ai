<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Suthar AI Design Ideation</title>
<link rel="stylesheet" href="style.css">
<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

.container{
background:white;
padding:20px;
margin:40px auto;
width:500px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

img{
max-width:100%;
margin-top:15px;
}

button{
padding:12px 20px;
background:black;
color:white;
border:none;
margin-top:15px;
cursor:pointer;
}

button:hover{
background:gray;
}

#loading{
color:red;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Suthar AI Design Ideation</h1>

<h3>Model Name: Suthar</h3>

<input type="file" id="imageUpload" accept="image/*">

<br>

<img id="preview">

<br>

<select id="designType">

<option value="">Select Design Type</option>

<option value="classical">Classical</option>

<option value="modern">Modern</option>

<option value="neoclassical">Neoclassical</option>

</select>

<br>

<button onclick="generateDesign()">Generate AI Design</button>

<div id="loading"></div>

</div>

<script src="script.js"></script>

</body>
</html>
